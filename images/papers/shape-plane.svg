<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Schematic: the (mu, t) plane of triangle shapes, with equilateral, squeezed and stretched triangles at its corners</title>
<text x="20" y="24" font-size="11" letter-spacing="1.6" fill="#A9B2C6">TRIANGLE SHAPES AT FIXED SIZE k₁</text>
<path d="M70 50L330 50L330 270L317 264.6L304 258.4L291 252.2L278 245.6L265 238.6L252 231.2L239 223.3L226 215L213 206.1L200 196.7L187 186.6L174 175.7L161 164.1L148 151.5L135 138L122 123.3L109 107.5L96 90L83 71.3Z" fill="#8EC9F2" fill-opacity=".10" stroke="#3A4566" stroke-width="1.2"/>
<path d="M177.7 178.9L330 50" stroke="#ECE7DC" stroke-opacity=".7" stroke-width="1.3" stroke-dasharray="5 4"/>
<text transform="translate(262 105) rotate(-40.2)" font-size="11.5" fill="#ECE7DC" text-anchor="middle">right-angled</text>
<text x="150" y="88" font-size="13" fill="#ECE7DC">Acute</text>
<text x="268" y="196" font-size="13" fill="#ECE7DC">Obtuse</text>
<circle cx="70" cy="50" r="5" fill="#F2B766"/>
<circle cx="330" cy="50" r="5" fill="#F2B766"/>
<circle cx="330" cy="270" r="5" fill="#F2B766"/>
<text x="62" y="40" font-size="12.5" fill="#F2B766">Equilateral</text>
<text x="340" y="54" font-size="12.5" fill="#F2B766">Squeezed</text>
<text x="340" y="274" font-size="12.5" fill="#F2B766">Stretched</text>
<text transform="translate(347 160) rotate(90)" font-size="11.5" fill="#A9B2C6" text-anchor="middle">linear triangles</text>
<path d="M58 50V270M70 282H330" stroke="#3A4566" stroke-width="1.2"/>
<g font-size="11.5" fill="#A9B2C6">
<text x="52" y="54" text-anchor="end">1</text><text x="52" y="164" text-anchor="end">0.75</text><text x="52" y="274" text-anchor="end">0.5</text>
<text x="70" y="298" text-anchor="middle">0.5</text><text x="200" y="298" text-anchor="middle">0.75</text><text x="330" y="298" text-anchor="middle">1</text>
</g>
<text x="22" y="112" font-size="16" fill="#ECE7DC" font-style="italic" font-family="'STIX Two Text', Cambria, serif">t</text>
<text x="200" y="316" font-size="16" fill="#ECE7DC" font-style="italic" text-anchor="middle" font-family="'STIX Two Text', Cambria, serif">μ</text>
<g font-size="12" fill="#A9B2C6">
<text x="372" y="120">Sides k₁ ≥ k₂ ≥ k₃</text>
<text x="372" y="146"><tspan font-style="italic" fill="#ECE7DC">t</tspan> = k₂ / k₁</text>
<text x="372" y="172"><tspan font-style="italic" fill="#ECE7DC">μ</tspan> = cosine of the</text>
<text x="372" y="188">angle between</text>
<text x="372" y="204">sides k₁ and k₂</text>
</g>
<text x="466" y="314" font-size="10" fill="#6E7891" text-anchor="end">Schematic</text>
</svg>
