<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Schematic of the paper's conclusions: which redshift-space bispectrum multipoles are sensitive to gravity beyond general relativity, and which are robust to galaxy bias</title>
<text x="20" y="26" font-size="11" letter-spacing="1.6" fill="#A9B2C6">WHICH MULTIPOLES CARRY THE GRAVITY SIGNAL</text>
<text x="466" y="26" font-size="10" fill="#6E7891" text-anchor="end">Schematic</text>
<g font-size="12" fill="#A9B2C6" text-anchor="end">
<text x="94" y="66">ℓ = 0</text><text x="94" y="101">ℓ = 2</text><text x="94" y="136">ℓ = 4</text><text x="94" y="171">ℓ = 6</text><text x="94" y="206">ℓ = 8</text>
</g>
<g font-size="11" fill="#6E7891" text-anchor="middle">
<text x="112" y="232">m=0</text><text x="146" y="232">1</text><text x="180" y="232">2</text><text x="214" y="232">3</text><text x="248" y="232">4</text><text x="282" y="232">5</text><text x="316" y="232">6</text><text x="350" y="232">7</text><text x="384" y="232">8</text>
</g>
<circle cx="112" cy="62" r="11" fill="none" stroke="#ECE7DC" stroke-width="1.5"/>
<g fill="#F2B766" fill-opacity=".35" stroke="#F2B766" stroke-width="1.2">
<circle cx="112" cy="97" r="11"/><circle cx="146" cy="97" r="11"/><circle cx="180" cy="97" r="11"/>
<circle cx="112" cy="132" r="11"/><circle cx="146" cy="132" r="11"/><circle cx="180" cy="132" r="11"/><circle cx="214" cy="132" r="11"/><circle cx="248" cy="132" r="11"/>
</g>
<g fill="#F2B766">
<circle cx="112" cy="167" r="11"/><circle cx="146" cy="167" r="11"/><circle cx="180" cy="167" r="11"/><circle cx="214" cy="167" r="11"/><circle cx="248" cy="167" r="11"/>
</g>
<g fill="none" stroke="#F2B766" stroke-width="1.5" stroke-dasharray="3 3">
<circle cx="282" cy="167" r="11"/><circle cx="316" cy="167" r="11"/>
</g>
<g fill="#3A4566">
<circle cx="112" cy="202" r="11"/><circle cx="146" cy="202" r="11"/><circle cx="180" cy="202" r="11"/><circle cx="214" cy="202" r="11"/><circle cx="248" cy="202" r="11"/><circle cx="282" cy="202" r="11"/><circle cx="316" cy="202" r="11"/><circle cx="350" cy="202" r="11"/><circle cx="384" cy="202" r="11"/>
</g>
<g font-size="12" fill="#ECE7DC">
<circle cx="44" cy="258" r="7" fill="none" stroke="#ECE7DC" stroke-width="1.5"/><text x="58" y="262">Monopole: the usual statistic, least sensitive</text>
<circle cx="44" cy="280" r="7" fill="#F2B766" fill-opacity=".35" stroke="#F2B766"/><text x="58" y="284">ℓ = 2, 4: more sensitive, but mixed with galaxy bias</text>
<circle cx="44" cy="302" r="7" fill="#F2B766"/><text x="58" y="306">ℓ = 6, m ≤ 4: sensitive and free of quadratic and tidal bias</text>
<circle cx="44" cy="324" r="7" fill="none" stroke="#F2B766" stroke-width="1.5" stroke-dasharray="3 3"/><text x="58" y="328">ℓ = 6, m &gt; 4: no second-order growth information</text>
<circle cx="44" cy="346" r="7" fill="#3A4566"/><text x="58" y="350">ℓ = 8: no independent information on gravity</text>
</g>
</svg>
