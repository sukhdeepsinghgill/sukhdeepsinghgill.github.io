<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Schematic: three baselines that close a triangle in the uv-plane</title>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F2B766"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8EC9F2"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ECE7DC"/></marker>
</defs>
<text x="30" y="34" font-size="11" letter-spacing="1.6" fill="#A9B2C6">GRIDDED VISIBILITIES · uv-PLANE</text>
<g stroke="#232C44" stroke-width="1">
<path d="M30 50H250M30 70H250M30 90H250M30 110H250M30 130H250M30 150H250M30 170H250M30 190H250M30 210H250M30 230H250M30 250H250M30 270H250"/>
<path d="M30 50V270M50 50V270M70 50V270M90 50V270M110 50V270M130 50V270M150 50V270M170 50V270M190 50V270M210 50V270M230 50V270M250 50V270"/>
</g>
<path d="M30 160H250M140 50V270" stroke="#3A4566" stroke-width="1.2"/>
<text x="246" y="176" font-size="13" fill="#A9B2C6" text-anchor="end">u</text>
<text x="146" y="64" font-size="13" fill="#A9B2C6">v</text>
<path d="M140 160L214 123" fill="none" stroke="#F2B766" stroke-width="2.2" marker-end="url(#a1)"/>
<path d="M220 120L117 82.5" fill="none" stroke="#8EC9F2" stroke-width="2.2" marker-end="url(#a2)"/>
<path d="M110 80L137.8 154.1" fill="none" stroke="#ECE7DC" stroke-width="2.2" marker-end="url(#a3)"/>
<circle cx="140" cy="160" r="3.5" fill="#ECE7DC"/>
<text x="186" y="160" font-size="15" fill="#F2B766"><tspan font-weight="700">U</tspan>₁</text>
<text x="168" y="88" font-size="15" fill="#8EC9F2"><tspan font-weight="700">U</tspan>₂</text>
<text x="98" y="128" font-size="15" fill="#ECE7DC" text-anchor="end"><tspan font-weight="700">U</tspan>₃</text>
<text x="276" y="74" font-size="13" fill="#A9B2C6">Every closed triangle of</text>
<text x="276" y="92" font-size="13" fill="#A9B2C6">baselines contributes</text>
<text x="276" y="130" font-size="18" fill="#ECE7DC" font-family="'STIX Two Text', Cambria, 'Times New Roman', serif">⟨ <tspan font-style="italic">V</tspan>(<tspan font-weight="700">U</tspan>₁) <tspan font-style="italic">V</tspan>(<tspan font-weight="700">U</tspan>₂) <tspan font-style="italic">V</tspan>(<tspan font-weight="700">U</tspan>₃) ⟩</text>
<text x="276" y="160" font-size="16" fill="#ECE7DC" font-family="'STIX Two Text', Cambria, 'Times New Roman', serif"><tspan font-weight="700">U</tspan>₁ + <tspan font-weight="700">U</tspan>₂ + <tspan font-weight="700">U</tspan>₃ = 0</text>
<text x="276" y="198" font-size="13" fill="#A9B2C6">FFTs sum over every triangle</text>
<text x="276" y="216" font-size="13" fill="#A9B2C6">shape and size at once.</text>
<text x="276" y="258" font-size="13" fill="#ECE7DC">Validated for 46 ≤ ℓ ≤ 1320</text>
<text x="276" y="277" font-size="13" fill="#ECE7DC">to 10–15% accuracy</text>
<text x="464" y="310" font-size="10" fill="#6E7891" text-anchor="end">Schematic · not to scale</text>
</svg>
