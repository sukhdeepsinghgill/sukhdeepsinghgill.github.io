<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Schematic: smooth component filtering removes the smooth foreground component at low line-of-sight wavenumber, leaving a cleaner EoR window at small k-perpendicular</title>
<defs><marker id="w1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A9B2C6"/></marker></defs>
<rect x="64" y="190" width="392" height="82" fill="#ECE7DC" fill-opacity=".05"/>
<path d="M64 272L456 272L456 200Z" fill="#F2B766" fill-opacity=".22"/>
<path d="M64 272L456 200" stroke="#F2B766" stroke-width="1.4"/>
<text x="448" y="258" font-size="12" fill="#F2B766" text-anchor="end">foreground wedge</text>
<text x="122" y="226" font-size="11.5" fill="#A9B2C6">smooth component filtered out</text>
<path d="M64 190H456" stroke="#ECE7DC" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="452" y="182" font-size="12" fill="#ECE7DC" text-anchor="end">filtering limit, k∥ ≈ 0.135 Mpc⁻¹</text>
<rect x="64" y="40" width="48" height="150" fill="#8EC9F2" fill-opacity=".22" stroke="#8EC9F2" stroke-width="1.4"/>
<text x="122" y="64" font-size="13" font-weight="600" fill="#8EC9F2">EoR window</text>
<text x="122" y="82" font-size="12" fill="#A9B2C6">k⊥ ≤ 0.026 Mpc⁻¹</text>
<text x="122" y="98" font-size="12" fill="#A9B2C6">k∥ &gt; 0.135 Mpc⁻¹</text>
<rect x="250" y="48" width="208" height="96" rx="8" fill="#10172A" stroke="#3A4566"/>
<text x="262" y="70" font-size="12.5" font-weight="600" fill="#ECE7DC">Smooth component filtering</text>
<text x="262" y="90" font-size="12" fill="#A9B2C6">foregrounds down by 10³–10⁴</text>
<text x="262" y="108" font-size="12" fill="#A9B2C6">missing-channel artefacts removed</text>
<text x="262" y="126" font-size="12" fill="#A9B2C6">residuals consistent with noise</text>
<path d="M64 272H460" stroke="#A9B2C6" stroke-width="1.4" marker-end="url(#w1)"/>
<path d="M64 272V34" stroke="#A9B2C6" stroke-width="1.4" marker-end="url(#w1)"/>
<text x="458" y="292" font-size="14" fill="#ECE7DC" text-anchor="end" font-style="italic" font-family="'STIX Two Text', Cambria, serif">k<tspan font-size="11" dy="3" font-style="normal">⊥</tspan></text>
<text x="40" y="44" font-size="14" fill="#ECE7DC" font-style="italic" font-family="'STIX Two Text', Cambria, serif">k<tspan font-size="11" dy="3" font-style="normal">∥</tspan></text>
<text x="20" y="312" font-size="10" fill="#6E7891">Schematic · not to scale</text>
</svg>
