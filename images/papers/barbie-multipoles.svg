<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Schematic: triangle orientation relative to the line of sight, and the 16 non-zero redshift-space bispectrum multipoles</title>
<defs>
<marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A9B2C6"/></marker>
<marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8EC9F2"/></marker>
</defs>
<text x="24" y="34" font-size="11" letter-spacing="1.6" fill="#A9B2C6">ORIENTATION</text>
<path d="M100 262V62" stroke="#A9B2C6" stroke-width="1.6" marker-end="url(#b1)"/>
<text x="108" y="70" font-size="12" fill="#A9B2C6">line of sight</text>
<path d="M52 196L152 184L96 142Z" fill="#F2B766" fill-opacity=".16" stroke="#F2B766" stroke-width="1.6" stroke-linejoin="round"/>
<text x="114" y="208" font-size="13" fill="#F2B766" font-family="'STIX Two Text', Cambria, serif"><tspan font-weight="700">k</tspan>₁</text>
<text x="132" y="160" font-size="13" fill="#F2B766" font-family="'STIX Two Text', Cambria, serif"><tspan font-weight="700">k</tspan>₂</text>
<text x="62" y="160" font-size="13" fill="#F2B766" font-family="'STIX Two Text', Cambria, serif"><tspan font-weight="700">k</tspan>₃</text>
<path d="M100 174L146 112" stroke="#8EC9F2" stroke-width="1.8" marker-end="url(#b2)"/>
<path d="M100 140A34 34 0 0 1 120.3 146.7" fill="none" stroke="#ECE7DC" stroke-width="1.2"/>
<text x="152" y="112" font-size="12" fill="#8EC9F2">normal</text>
<text x="100" y="284" font-size="12" fill="#A9B2C6" text-anchor="middle">Two angles fix how the</text>
<text x="100" y="300" font-size="12" fill="#A9B2C6" text-anchor="middle">triangle is tilted</text>
<line x1="206" y1="40" x2="206" y2="296" stroke="#232C44"/>
<text x="228" y="34" font-size="11" letter-spacing="1.6" fill="#A9B2C6">ALL 16 NON-ZERO MULTIPOLES</text>
<g font-size="12" fill="#A9B2C6" text-anchor="end">
<text x="262" y="76">ℓ = 0</text><text x="262" y="112">ℓ = 2</text><text x="262" y="148">ℓ = 4</text><text x="262" y="184">ℓ = 6</text>
</g>
<g font-size="11" fill="#6E7891" text-anchor="middle">
<text x="284" y="212">m=0</text><text x="310" y="212">1</text><text x="336" y="212">2</text><text x="362" y="212">3</text><text x="388" y="212">4</text><text x="414" y="212">5</text><text x="440" y="212">6</text>
</g>
<g fill="#8EC9F2"><circle cx="284" cy="72" r="9"/><circle cx="284" cy="108" r="9"/><circle cx="284" cy="144" r="9"/><circle cx="284" cy="180" r="9"/></g>
<g fill="#F2B766">
<circle cx="310" cy="108" r="9"/><circle cx="336" cy="108" r="9"/>
<circle cx="310" cy="144" r="9"/><circle cx="336" cy="144" r="9"/><circle cx="362" cy="144" r="9"/><circle cx="388" cy="144" r="9"/>
<circle cx="310" cy="180" r="9"/><circle cx="336" cy="180" r="9"/><circle cx="362" cy="180" r="9"/><circle cx="388" cy="180" r="9"/><circle cx="414" cy="180" r="9"/><circle cx="440" cy="180" r="9"/>
</g>
<circle cx="234" cy="240" r="6" fill="#8EC9F2"/><text x="246" y="244" font-size="12" fill="#ECE7DC">m = 0: the usual measurements</text>
<circle cx="234" cy="262" r="6" fill="#F2B766"/><text x="246" y="266" font-size="12" fill="#ECE7DC">m ≠ 0: often left out, measured here</text>
<text x="228" y="296" font-size="12" fill="#A9B2C6">Cost ∝ <tspan font-style="italic">N</tspan><tspan font-size="9" dy="3">g</tspan><tspan dy="-3">⁴ instead of </tspan><tspan font-style="italic">N</tspan><tspan font-size="9" dy="3">g</tspan><tspan dy="-3">⁶</tspan></text>
<text x="464" y="314" font-size="10" fill="#6E7891" text-anchor="end">Schematic</text>
</svg>
